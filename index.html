<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Todo List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="login-screen" class="screen">
            <h1>GitHub Todo List</h1>
            <p class="subtitle">Store your todos in a GitHub repository</p>

            <div class="setup-form">
                <div class="form-group">
                    <label for="token">GitHub Personal Access Token</label>
                    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
                    <small>Needs <code>repo</code> scope. <a href="https://github.com/settings/tokens/new?scopes=repo&description=Todo%20App" target="_blank">Create token</a></small>
                </div>

                <div class="form-group">
                    <label for="encryption-password">Encryption Password</label>
                    <input type="password" id="encryption-password" placeholder="Enter a strong password">
                    <small>Your todos are encrypted with AES-256. Remember this password!</small>
                </div>

                <div class="form-group hidden" id="confirm-password-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Re-enter your password">
                    <small>First-time setup: confirm your encryption password</small>
                </div>

                <button id="check-btn" class="btn primary">Continue</button>
                <button id="login-btn" class="btn primary hidden">Sign In</button>
                <p id="login-error" class="error"></p>
            </div>
        </div>

        <!-- Todo Screen -->
        <div id="todo-screen" class="screen hidden">
            <header>
                <h1>My Todos</h1>
                <div class="user-info">
                    <img id="user-avatar" src="" alt="avatar">
                    <span id="user-name"></span>
                    <button id="logout-btn" class="btn small">Logout</button>
                </div>
            </header>

            <div class="add-todo">
                <input type="text" id="new-todo" placeholder="What needs to be done?">
                <button id="add-btn" class="btn primary">Add</button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <ul id="todo-list"></ul>

            <div class="footer">
                <span id="items-left">0 items left</span>
                <button id="clear-completed" class="btn small">Clear Completed</button>
            </div>

            <p id="sync-status" class="sync-status"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
